<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The torus in Arnold-Liouville</title>
<meta name="description" content="Why a compact level set of an integrable system is a torus: commuting flows, the lattice of return times, Proposition 16.3 of the symplectic geometry notes.">
<style>
  /* The page is white always. "Dark" changes only the colours drawn on the canvas (COLS below). */
  :root { --bg:#fff; --fg:#1c1c1c; --mute:#6b6b6b; --line:#d9d6cf; --panel:#f1efe9; --hinge:#096762; --motion:#bc4d2c; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.42 Georgia, "Times New Roman", serif; }
  .wrap { display:flex; flex-direction:column; height:100vh; }
  #stage { flex:1 1 auto; min-height:230px; position:relative; }
  canvas { position:absolute; inset:0; width:100%; height:100%; display:block; cursor:grab; touch-action:none; }
  canvas:active { cursor:grabbing; }
  /* The title is the one sentence the step is about; it may take two or three lines and stays clear of the buttons on the right. */
  h1 { position:absolute; left:12px; top:7px; right:196px; font-size:16.5px; line-height:1.28; margin:0; font-weight:normal; pointer-events:none; border-left:3px solid var(--hinge); padding-left:9px; }
  .hint { position:absolute; left:12px; bottom:5px; color:var(--mute); font-size:12px; pointer-events:none; }
  .dk { position:absolute; right:10px; top:9px; z-index:2; display:flex; gap:10px; font-size:13px; white-space:nowrap; }
  /* The panel takes at most 42% of the height, so the figure keeps the larger part. Long text scrolls inside #text; the controls and Back / Next stay in view. */
  aside { flex:0 0 auto; display:flex; flex-direction:column; padding:6px 12px 5px; background:var(--panel); border-top:1px solid var(--line); max-height:42vh; }
  #text { flex:0 1 auto; min-height:0; overflow:auto; }
  .cols, nav { flex:0 0 auto; }
  #text p { margin:0 0 4px; font-size:13.5px; line-height:1.36; }
  #text .pt { font-size:14.5px; border-left:3px solid var(--hinge); padding:0 0 0 9px; margin-bottom:5px; }
  #text ol { margin:0 0 4px; padding-left:22px; font-size:13.5px; line-height:1.36; } #text li { margin:0 0 1px; }
  #text .src { color:var(--mute); font-size:12px; }
  .r1 { color:var(--motion); } .r2 { color:var(--hinge); }
  .cols { display:grid; grid-template-columns:1.25fr 1fr; gap:0 20px; margin-top:3px; }
  h2 { font-size:11.5px; margin:2px 0 1px; text-transform:uppercase; letter-spacing:.06em; color:var(--mute); font-weight:normal; }
  label { display:inline-flex; align-items:center; gap:5px; cursor:pointer; white-space:nowrap; }
  button { font:inherit; font-size:12.5px; padding:2px 8px; margin:0; border:1px solid var(--line); background:var(--bg); color:var(--fg); border-radius:4px; cursor:pointer; }
  button:hover { border-color:var(--fg); }
  button.on { background:var(--fg); color:var(--bg); border-color:var(--fg); }
  button:disabled { opacity:.35; cursor:default; }
  input[type=range] { width:100%; margin:0; accent-color:var(--motion); }
  .ctl { display:grid; grid-template-columns:auto auto 1fr 4.2em; gap:3px 7px; align-items:center; }
  .ctl .v { text-align:right; font-variant-numeric:tabular-nums; color:var(--mute); font-size:12.5px; }
  .ctl button { min-width:2.1em; padding:2px 5px; }
  .ctl .nop { width:0; }
  .rows { display:grid; grid-template-columns:auto auto 1fr; gap:0 9px; align-items:baseline; font-size:12.5px; line-height:1.3; }
  .rows .n { font-variant-numeric:tabular-nums; text-align:right; }
  .rows .w { color:var(--mute); font-size:12px; }
  nav { display:flex; align-items:center; gap:10px; margin-top:4px; padding-top:4px; border-top:1px solid var(--line); }
  nav button { padding:1px 12px; font-size:13px; }
  #count { color:var(--mute); font-size:13px; }
  #dots { flex:1; display:flex; gap:5px; justify-content:center; }
  #dots b { width:9px; height:9px; border-radius:50%; border:1px solid var(--mute); cursor:pointer; }
  #dots b.on { background:var(--fg); border-color:var(--fg); }
  .fs { position:absolute; right:10px; top:32px; z-index:2; display:flex; gap:10px; font-size:13px; white-space:nowrap; }
  .fs label { display:inline-flex; align-items:center; gap:5px; margin:0; cursor:pointer; }
.tb { position:absolute; right:10px; top:55px; z-index:2; display:flex; gap:10px; font-size:13px; white-space:nowrap; }
.tb label { display:inline-flex; align-items:center; gap:5px; margin:0; cursor:pointer; }
body.notools aside { display:none; }   /* the toolbox can always be hidden: the figure takes the whole page */
</style>
</head>
<body>
<div class="wrap">
  <div id="stage"><canvas id="cv"></canvas>
    <div class="tb" title="Show or hide the toolbox under the figure. Key t."><label><input type="radio" name="tb" id="tbS" checked> Tools</label><label><input type="radio" name="tb" id="tbH"> No tools</label></div>
    <div class="fs" title="Full screen: the whole page, controls included. Key f, or Esc to leave."><label><input type="radio" name="fs" id="fsW" checked> Window</label><label><input type="radio" name="fs" id="fsF"> Full screen</label></div>
    <div class="dk" title="The page stays white; only the drawing colours change."><label><input type="radio" name="dk" id="dkL"> Light</label><label><input type="radio" name="dk" id="dkD"> Dark</label></div>
    <h1 id="title"></h1>
    <div class="hint" id="hint">Drag to rotate. Scroll to change the size.</div>
  </div>
  <aside>
    <div id="text"></div>
    <div class="cols">
      <div><div class="ctl" id="ctl"></div></div>
      <div><h2 id="rowsT">Numbers</h2><div class="rows" id="rows"></div></div>
    </div>
    <nav><button id="back">&lsaquo; Back</button><span id="count"></span><span id="dots"></span><button id="next">Next &rsaquo;</button></nav>
  </aside>
</div>
<script>
// ---------- geometry (no DOM) ----------
// M = R^4 with coordinates x = (q1, p1, q2, p2) and omega = dq1^dp1 + dq2^dp2.
// The vector field X_f is defined by i_{X_f} omega = df (the convention of the notes), so X_f = (f_p1, -f_q1, f_p2, -f_q2).
const TAU = 2*Math.PI;
const I1 = x => (x[0]*x[0] + x[1]*x[1])/2, I2 = x => (x[2]*x[2] + x[3]*x[3])/2;
const F = (x, w) => [I1(x) + w*I2(x), I2(x)];                 // f1 = H = I1 + w I2,  f2 = I2
const hamVec = g => [g[1], -g[0], g[3], -g[2]];               // from the gradient g of f to X_f
// Turn the (q1,p1) plane by a and the (q2,p2) plane by b, both clockwise: the exact flow of q' = p, p' = -q.
function turn(x, a, b) { const ca = Math.cos(a), sa = Math.sin(a), cb = Math.cos(b), sb = Math.sin(b);
  return [x[0]*ca + x[1]*sa, -x[0]*sa + x[1]*ca, x[2]*cb + x[3]*sb, -x[2]*sb + x[3]*cb]; }
// t.x : the flow of f1 for time t1 and the flow of f2 for time t2.
const flow = (x, t1, t2, w) => turn(x, t1, w*t1 + t2);
const pt = (a, b, r1, r2) => [r1*Math.cos(a), -r1*Math.sin(a), r2*Math.cos(b), -r2*Math.sin(b)];   // the point with angles (a, b)
const angles = x => [Math.atan2(-x[1], x[0]), Math.atan2(-x[3], x[2])];
const gens = w => [[TAU, -TAU*w], [0, TAU]];                  // generators of the lattice of times that fix every point
const toAngles = (t, w) => [t[0], w*t[0] + t[1]];             // the linear map T: sends the generators to (2 pi, 0) and (0, 2 pi)
const dist4 = (x, y) => Math.hypot(x[0]-y[0], x[1]-y[1], x[2]-y[2], x[3]-y[3]);
// The picture (my choice): scale x to the unit 3-sphere and project stereographically from (0,0,0,1) to 3-space.
// A level set {I1 = c1, I2 = c2} becomes a torus of revolution about the third axis.
function proj(x) { const n = Math.hypot(x[0],x[1],x[2],x[3]), d = 1 - x[3]/n; return [x[0]/n/d, x[1]/n/d, x[2]/n/d]; }
function torusRadii(x) { const n = Math.hypot(x[0],x[1],x[2],x[3]), a = Math.hypot(x[0],x[1])/n, b = Math.hypot(x[2],x[3])/n; return [1/a, b/a]; }   // big, small
function normal(p, x) { const Rc = torusRadii(x)[0], h = Math.hypot(p[0],p[1]) || 1, v = [p[0] - Rc*p[0]/h, p[1] - Rc*p[1]/h, p[2]], m = Math.hypot(v[0],v[1],v[2]) || 1;
  return [v[0]/m, v[1]/m, v[2]/m]; }
const R1 = Math.sqrt(3), R2 = 1, W0 = 0.5;                    // the level set I1 = 1.5, I2 = 0.5; second oscillator at half speed
const X0 = pt(3.15, -0.6, R1, R2);                              // the base point x
if (typeof module !== "undefined") module.exports = { I1, I2, F, hamVec, turn, flow, pt, angles, gens, toAngles, dist4, proj, torusRadii, normal, R1, R2, W0, X0, TAU };

// ---------- page ----------
if (typeof document !== "undefined") {
const $ = id => document.getElementById(id);
const cv = $("cv"), ctx = cv.getContext("2d"), PI = Math.PI;
const COLS = { light:{ ink:"#202e32", quiet:"#a1a9a4", hinge:"#096762", motion:"#bc4d2c", fill:"rgba(188,77,44,.15)", halo:"#fff" },
               dark: { ink:"#f5f5f5", quiet:"#9a9a9a", hinge:"#4fc3b5", motion:"#ff8a65", fill:"rgba(255,138,101,.30)", halo:null } };
let dark = false; try { dark = localStorage.getItem("darkCols") === "1"; } catch (e) {}
const I = s => "<i>" + s + "</i>", sb = (s, n) => `<i>${s}</i><sub>${n}</sub>`;
const f1 = sb("f",1), f2 = sb("f",2), X1 = sb("X",1), X2 = sb("X",2), t1 = sb("t",1), t2 = sb("t",2), g1 = sb("&gamma;",1), g2 = sb("&gamma;",2), Rn = "&#8477;", Gam = "&Gamma;";
const fx = (v, n) => v.toFixed(n === undefined ? 3 : n), fpi = v => (Math.abs(v/PI) < 0.005 ? 0 : v/PI).toFixed(2) + "&pi;";
const samp = (fn, lo, hi, n) => { const o = []; for (let i = 0; i <= n; i++) o.push(fn(lo + (hi-lo)*i/n)); return o; };
const mod = a => ((a % TAU) + TAU) % TAU;
const G = gens(W0);

// ----- scenes -----
const timeCtl = (key, label, lo, hi, extra) => ({ key, label, kind:"wrap", play:true, range:() => [lo,hi], fmt:fpi, ...extra });
const T1 = timeCtl("t1", `time ${t1} along ${X1}`, 0, TAU), T2 = timeCtl("t2", `time ${t2} along ${X2}`, 0, TAU);
function orbitScene(st) { const a = flow(X0, st.t1, 0, W0), y = flow(X0, st.t1, st.t2, W0);
  return { kind:"torus",
    curves:[{ X:samp(s => flow(y, s, 0, W0), 0, 2*TAU, 160), col:"motion", w:1.3, dash:[1.5,5] }, { X:samp(s => flow(y, 0, s, W0), 0, TAU, 80), col:"hinge", w:1.3, dash:[1.5,5] },
            { X:samp(s => flow(X0, s, 0, W0), 0, st.t1, 60), col:"motion", w:3 }, { X:samp(s => flow(a, 0, s, W0), 0, st.t2, 60), col:"hinge", w:3 }],
    dots:[{ x:X0, col:"ink", label:"x" }, { x:y, col:"motion", label:"t·x", big:true }],
    right:{ c:[PI, PI/2], half:1.72*PI, lattice:true, polys:[{ pts:[[0,0], G[0], [G[0][0]+G[1][0], G[0][1]+G[1][1]], G[1]], stroke:"quiet" }],
      segs:[{ a:[0,0], b:[st.t1,0], col:"motion", w:3 }, { a:[st.t1,0], b:[st.t1,st.t2], col:"hinge", w:3 }], pt:[st.t1,st.t2], cap:"plane of times; dots: the lattice Γ" },
    rowsT:"Values", rows:[[f1, fx(F(y,W0)[0]), "fixed"], [f2, fx(F(y,W0)[1]), "fixed"], ["distance from "+I("t")+"&middot;"+I("x")+" to "+I("x"), fx(dist4(y,X0)), "changes"]] }; }
const orbitStep = { init:() => ({ t1:2.2, t2:1.6 }), controls:[T1, T2], scene:orbitScene };

const STEPS = [
 { title:`A compact level set of an integrable system is a torus: the plane of times (${t1}, ${t2}) divided by the times that bring a point back`, ...orbitStep,
   text:`<p>Press play. Left: a point of the level set, moved by two flows. Right: how long each flow ran.</p><ol>
     <li>One function: circles (step 2).</li>
     <li>Two functions and their level set ${I("N")} (3, 4).</li>
     <li>Proposition 16.3: the flows act on ${I("N")} (5) and reach every point (6); the return times form a lattice (7); so ${I("N")} is a torus (8).</li>
     <li>The flow of ${I("H")} on the torus (9). Sources (10), summary (11).</li></ol>` },

 { title:`The integral curves of the harmonic oscillator Hamiltonian are circles, each traversed in time 2&pi;`, hint:"",
   text:`<p>${I("&omega;")} = ${I("dq")} &and; ${I("dp")}, ${sb("X","H")} = (${I("p")}, &minus;${I("q")}). Press play: the red point is ${I("x")} after time ${I("t")}. So the circle is the line of times with ${I("t")} and ${I("t")} + 2&pi; identified: ${Rn}/2&pi;&#8484;. The torus will appear the same way, with two times.</p>`,
   init:() => ({ t:1.1, c:1 }),
   controls:[timeCtl("t", `time ${I("t")} along ${sb("X","H")}`, 0, 2*TAU), { key:"c", label:`value of ${I("H")}`, range:() => [0.2,2], fmt:v => fx(v,2) }],
   scene:st => { const r = Math.sqrt(2*st.c), x = [r*Math.cos(0.7), -r*Math.sin(0.7), 0, 0], y = turn(x, st.t, 0);
     return { kind:"plane", r, x, y, t:st.t, rows:[[I("H"), fx(I1(y)), "fixed"], [I("q"), fx(y[0]), "changes"], [I("p"), fx(y[1]), "changes"]] }; } },

 { title:`An integrable system on ${Rn}<sup>4</sup>: two functions ${f1} = ${I("H")} and ${f2}, each constant along the flow of the other`, hint:"",
   text:`<p>Two harmonic oscillators, one in each plane, with ${sb("I","k")} = (${sb("q","k")}<sup>2</sup> + ${sb("p","k")}<sup>2</sup>)/2: &nbsp; <span class="r1">${f1} = ${I("H")} = ${sb("I",1)} + &frac12;${sb("I",2)}</span>, &nbsp; <span class="r2">${f2} = ${sb("I",2)}</span>.</p>
     <p>Play either flow: both values stay fixed (table). This is {${f1}, ${f2}} = 0.</p>
     <p class="src">Notes, Definition 16.1. It also asks that ${I("d")}${f1}, ${I("d")}${f2} be independent: true where neither circle is a point. The example is my choice.</p>`,
   init:() => ({ t1:0.8, t2:0.5 }), controls:[{ ...T1, label:`time ${t1}, flow of ${f1}` }, { ...T2, label:`time ${t2}, flow of ${f2}` }],
   scene:st => { const y = flow(X0, st.t1, st.t2, W0);
     return { kind:"planes", y, rowsT:"Values", rows:[[f1, fx(F(y,W0)[0]), "fixed"], [f2, fx(F(y,W0)[1]), "fixed"], [sb("q",1), fx(y[0]), "changes"], [sb("q",2), fx(y[2]), "changes"]] }; } },

 { title:`Fix the two values of ${f1} and ${f2}. There is still room to wander: a surface ${I("N")}, and here it is a torus`,
   text:`<p>${I("N")} = {${f1} = 1.75, ${f2} = 0.5}: one circle in each plane, so a torus. The two ways to wander are the flows of ${f1} and ${f2}; <span class="r1">${X1}</span>, <span class="r2">${X2}</span> are their vector fields. Press play.</p>
     <p>Proposition 16.3 proves it is a torus without looking, from ${I("N")}, ${X1}, ${X2} alone (steps 5 to 8).</p>
     <p class="src">Tangent: ${I("d")}${sb("f","i")}(${sb("X","j")}) = {${sb("f","i")}, ${sb("f","j")}} = 0. Commuting: [${X1}, ${X2}] = &minus;${sb("X","{"+f1+", "+f2+"}")} = 0. The picture is a projection of ${I("N")} from ${Rn}<sup>4</sup> to 3-space (my choice); the motion is computed in ${Rn}<sup>4</sup>.</p>`,
   init:() => ({ t1:0.6, t2:0.9 }), controls:[T1, T2],
   scene:st => { const y = flow(X0, st.t1, st.t2, W0);
     return { kind:"torus", curves:[{ X:samp(s => flow(y, s, 0, W0), 0, 2*TAU, 160), col:"motion", w:1.3, dash:[1.5,5] }, { X:samp(s => flow(y, 0, s, W0), 0, TAU, 80), col:"hinge", w:1.3, dash:[1.5,5] }],
       dots:[{ x:y, col:"ink", big:true }], arrows:[{ x:y, d:[1,0], col:"motion", label:"X₁" }, { x:y, d:[0,1], col:"hinge", label:"X₂" }],
       rowsT:"Values", rows:[[f1, fx(F(y,W0)[0]), "fixed"], [f2, fx(F(y,W0)[1]), "fixed"]] }; } },

 { title:`Since [${X1}, ${X2}] = 0, the two flows can be done in either order: pairs of times (${t1}, ${t2}) act on ${I("N")}`,
   text:`<p>Solid: <span class="r1">${X1}</span> for time ${t1}, then <span class="r2">${X2}</span> for time ${t2}. Dashed: the other order. Same end point (table). Call it ${I("t")}&middot;${I("x")}.</p>
     <p class="src">Proposition 16.3, step 1.</p>`,
   init:() => ({ t1:1.9, t2:2.6 }),
   controls:[{ key:"t1", label:`time ${t1} along ${X1}`, play:true, range:() => [0,4.4], fmt:fpi }, { key:"t2", label:`time ${t2} along ${X2}`, play:true, range:() => [0,4.4], fmt:fpi }],
   scene:st => { const a = flow(X0, st.t1, 0, W0), b = flow(X0, 0, st.t2, W0), ya = flow(a, 0, st.t2, W0), yb = flow(b, st.t1, 0, W0);
     return { kind:"torus",
       curves:[{ X:samp(s => flow(X0, 0, s, W0), 0, st.t2, 60), col:"hinge", w:2, dash:[5,4] }, { X:samp(s => flow(b, s, 0, W0), 0, st.t1, 60), col:"motion", w:2, dash:[5,4] },
               { X:samp(s => flow(X0, s, 0, W0), 0, st.t1, 60), col:"motion", w:3 }, { X:samp(s => flow(a, 0, s, W0), 0, st.t2, 60), col:"hinge", w:3 }],
       dots:[{ x:X0, col:"ink", label:"x" }, { x:ya, col:"ink", label:"t·x", big:true }],
       right:{ c:[2.2,2.2], half:3.1, segs:[{ a:[0,0], b:[0,st.t2], col:"hinge", w:2, dash:[5,4] }, { a:[0,st.t2], b:[st.t1,st.t2], col:"motion", w:2, dash:[5,4] },
           { a:[0,0], b:[st.t1,0], col:"motion", w:3 }, { a:[st.t1,0], b:[st.t1,st.t2], col:"hinge", w:3 }], pt:[st.t1,st.t2], cap:"plane of times" },
       rowsT:"Check", rows:[["distance between the two ends", fx(dist4(ya,yb)), "same point"]] }; } },

 { title:`Starting from one point ${I("x")}, the two flows reach every point of ${I("N")}`,
   text:`<p>Right: a square of times around 0. Left: the points ${I("t")}&middot;${I("x")} for ${I("t")} in the square. Press play: the square grows and its image covers ${I("N")}.</p>
     <p>Why: ${X1}, ${X2} are independent, so a small square of times gives a small patch around each reached point. The set of reached points is then open, also closed, and ${I("N")} is connected.</p>
     <p class="src">Proposition 16.3, step 2. Past half side &pi; the image overlaps itself: different times give the same point.</p>`,
   init:() => ({ s:0.7 }), controls:[{ key:"s", label:"half side of the square", play:true, range:() => [0.15,4.2], fmt:fpi }],
   scene:st => { const s = st.s, curves = [], n = Math.max(8, Math.round(s*14));
     const ks = []; for (let k = 0; k*0.35 < s; k++) { ks.push(k*0.35); if (k) ks.push(-k*0.35); } ks.push(s, -s);
     for (const k of ks) { curves.push({ X:samp(u => flow(X0, u, k, W0), -s, s, n), col:"motion", w:1.1 }); curves.push({ X:samp(u => flow(X0, k, u, W0), -s, s, n), col:"hinge", w:1.1 }); }
     return { kind:"torus", curves, dots:[{ x:X0, col:"ink", label:"x" }],
       right:{ c:[0,0], half:4.7, polys:[{ pts:[[-s,-s],[s,-s],[s,s],[-s,s]], fill:"fill", stroke:"motion" }], pt:[0,0], cap:"plane of times" },
       rowsT:"Patch", rows:[["covers", s >= PI ? "all of " + I("N") : "part of " + I("N"), ""]] }; } },

 { title:`The times that bring ${I("x")} back to itself form a lattice ${Gam} in the plane of times`,
   text:`<p>Black dots: the times ${I("t")} with ${I("t")}&middot;${I("x")} = ${I("x")}. Move ${t1}, ${t2} onto a dot: the red point is back at ${I("x")} (table).</p>
     <p>(2&pi;, 0) is not a dot: after it the second circle has made only half a turn. The dots are generated by ${g1} = (2&pi;, &minus;&pi;) and ${g2} = (0, 2&pi;).</p>
     <p class="src">Proposition 16.3, step 3. In general ${Gam} is a discrete subgroup of ${Rn}<sup>2</sup>, so it has 0, 1 or 2 generators.</p>`,
   init:() => ({ t1:PI, t2:PI/2 }),
   controls:[timeCtl("t1", `time ${t1} along ${X1}`, -TAU, TAU, { step:PI/12 }), timeCtl("t2", `time ${t2} along ${X2}`, -TAU, TAU, { step:PI/12 })],
   scene:st => { const y = flow(X0, st.t1, st.t2, W0), dd = dist4(y, X0);
     return { kind:"torus", curves:[{ X:samp(u => flow(X0, u*st.t1, u*st.t2, W0), 0, 1, 140), col:"motion", w:2.6 }],
       dots:[{ x:X0, col:"ink", label:"x" }, { x:y, col:"motion", label:"t·x", big:true }],
       right:{ c:[0,0], half:2.3*PI, lattice:true, segs:[{ a:[0,0], b:[st.t1,st.t2], col:"motion", w:2.6 }], pt:[st.t1,st.t2], cap:"plane of times; dots: Γ" },
